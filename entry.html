<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <title>Owl Watcher | Add Vehicle</title>
    <style>
        body { font-family: 'Caveat', cursive; background: #fdf6e3; color: #5d4037; text-align: center; padding: 20px; }
        .card { max-width: 400px; margin: 40px auto; background: #ffffff; padding: 30px; border: 2px solid #8d6e63; border-radius: 20px; box-shadow: 4px 4px 0px #5d4037; }
        input, select { width: 85%; padding: 10px; border: 2px solid #8d6e63; border-radius: 10px; font-size: 1.2rem; margin-bottom: 15px; font-family: 'Caveat', cursive; background: #fff; }
        button { background: #8d6e63; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-size: 1.3rem; font-family: 'Caveat', cursive; box-shadow: 2px 2px 0px #5d4037; }
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 15% auto; padding: 20px; border: 2px solid #8d6e63; width: 80%; max-width: 320px; border-radius: 20px; }
        .close { color: #5d4037; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 15px; color: #8d6e63; text-decoration: underline; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Add Vehicle Entry 🚗</h1>
        <p>Society: <b id="societyNameLabel">Loading...</b></p>
        
        <form id="vehicleForm">
            <select id="flatSelect" required>
                <option value="">Select Flat Number/Name</option>
            </select>
            <br>
            <input type="text" id="vehicleNumber" placeholder="Vehicle Number (e.g., GJ01AB1234)" required>
            <br>
            <input type="tel" id="mobileNumber" placeholder="Mobile Number" required>
            <br>
            <button type="submit">Submit Entry</button>
        </form>
        
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('resultModal').style.display='none'">&times;</span>
            <div id="modalMessage"></div>
        </div>
    </div>

    <script type="module">
       // Replace the top section of your <script type="module"> tag with this clean import block

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
   
        // Use same Firebase config
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEYKHQpy_VjmgjYiWQOPjXth1bghYsf9M",
            authDomain: "finder-owl.firebaseapp.com",
            projectId: "finder-owl",
            storageBucket: "finder-owl.firebasestorage.app",
            messagingSenderId: "1011347100861",
            appId: "1:1011347100861:web:24246f9a4eb24d812cd3d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const societyId = urlParams.get('societyId');

        const modal = document.getElementById("resultModal");
        function showModal(msg) {
            document.getElementById("modalMessage").innerHTML = msg;
            modal.style.display = "block";
        }
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

        let societyData = {};

        async function initPage() {
            if (!societyId) {
                showModal("⚠️ No society selected. Redirecting...");
                setTimeout(() => window.location.href = "index.html", 2000);
                return;
            }

            const socDoc = await getDoc(doc(db, "societies", societyId));
            if (socDoc.exists()) {
                societyData = socDoc.data();
                document.getElementById("societyNameLabel").innerText = societyData.name || "Unknown";

                // Populate Flat Dropdown from Admin-defined array (e.g., societyData.flats = ["A1-101", "B2-101"])
                const flatSelect = document.getElementById("flatSelect");
                if (societyData.flats && Array.isArray(societyData.flats)) {
                    societyData.flats.forEach(flat => {
                        let opt = document.createElement("option");
                        opt.value = flat;
                        opt.textContent = flat;
                        flatSelect.appendChild(opt);
                    });
                }
            }
        }

        initPage();

        document.getElementById("vehicleForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const flatNumber = document.getElementById("flatSelect").value;
            const vehicleNumber = document.getElementById("vehicleInput")?.value.trim().toUpperCase() || document.getElementById("vehicleNumber").value.trim().toUpperCase();
            const mobileNumber = document.getElementById("mobileNumber").value.trim();

            // 1. Verify Duplicate Entry in Firebase Database
            const vehiclesRef = collection(db, "vehicles");
            const q = query(vehiclesRef, where("societyName", "==", societyData.name), where("vehicleNumber", "==", vehicleNumber));
            const existingSnap = await getDocs(q);

            if (!existingSnap.empty) {
                showModal("<p>❌ <b>Duplicate Entry</b><br>This vehicle number is already registered for this society.</p>");
                return;
            }

            // 2. Check Vehicle Limit Configuration 
            // Expecting admin config: societyData.maxVehiclesPerFlat (e.g., 2)
            const flatVehiclesQuery = query(vehiclesRef, where("societyName", "==", societyData.name), where("flatNumber", "==", flatNumber));
            const flatVehiclesSnap = await getDocs(flatVehiclesQuery);
            const allowedLimit = societyData.maxVehiclesPerFlat || 3; // Fallback limit

            if (flatVehiclesSnap.size >= allowedLimit) {
                showModal(`<p>⚠️ Limit Reached! Only <b>${allowedLimit}</b> vehicles are allowed per flat in this society.</p>`);
                return;
            }

            // 3. Save to Firestore
            try {
                await addDoc(vehiclesRef, {
                    societyName: societyData.name,
                    flatNumber: flatNumber,
                    vehicleNumber: vehicleNumber,
                    mobileNumber: mobileNumber,
                    timestamp: new Date()
                });
                showModal("<p>✅ Vehicle registered successfully!</p>");
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (err) {
                console.error(err);
                showModal("<p>❌ Error saving entry. Try again.</p>");
            }
        });
    </script>
</body>
</html>
